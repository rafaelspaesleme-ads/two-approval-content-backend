spring:
  application:
    name: two-approval-content-backend
  data:
    mongodb:
      host: localhost
      port: 27017
      username: ${USERNAME_MONGO_DB}
      password: ${PASSWORD_MONGO_DB}
      database: ${DB_MONGO_DB}
      authentication-database: ${AUTH_DB_MONGO_DB}
  ai:
    deepseek:
      api-key: ${DEEP_SEEK_API_KEY}
      chat:
        options:
          temperature: 0.0
  mail:
    host: ${HOST_SRV_MAIL}
    port: ${PORT_SRV_MAIL}
    username: ${USERNAME_SRV_MAIL}
    password: ${PASSWORD_SRV_MAIL}
    protocol: smtps
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true

  contexts:
    security:
      jwt:
        secret: ${SECRET_JWT}
    api:
      key: ${API_KEY}
    support:
      email: ${CONTEXTS_SUPPORT_EMAIL}
      whatsapp: ${CONTEXTS_SUPPORT_WHATSAPP}
      linkDoc: ${CONTEXTS_SUPPORT_DOC}

server:
  servlet:
    context-path: /api/two-approval-content